name: Checks

# The APK build already runs on every push, but it says nothing about the admin
# portal or the Cloud Functions — and those are the two things that get deployed by
# hand. This job is the guard for them, and it finishes in well under a minute.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the "engines" in functions/package.json, so a syntax the
          # deployed runtime rejects is rejected here too.
          node-version: '20'

      - name: Portal loads without dying
        run: node web/smoke-test.mjs web/index.html

      - name: Portal logic is still correct
        run: node web/parser-test.mjs web/index.html

      - name: Portal still renders correctly
        run: node web/render-test.mjs web/index.html

      # The service rules are implemented three times and cannot share code across two
      # languages and three deploy roots, so all three answer to one table of cases.
      # The phone app's copy is checked by gradle test in the build-apk workflow.
      - name: Portal matches the service schedule spec
        run: node web/service-schedule-test.mjs web/index.html service-schedule-cases.csv

      - name: Reminder job matches the service schedule spec
        run: node functions/service-schedule-test.mjs service-schedule-cases.csv

      # Same arrangement for the parking curfew, which the portal and the phone app both
      # implement. The phone's copy is checked by gradle test in the build-apk workflow.
      - name: Portal matches the parking curfew spec
        run: node web/parking-curfew-test.mjs web/index.html parking-curfew-cases.csv

      # And for how a registration plate is written out — the third rule implemented on
      # both sides, so the third table they both answer to.
      - name: Portal matches the plate format spec
        run: node web/plate-format-test.mjs web/index.html plate-format-cases.csv

      # And for the performance figures — how a team's month adds up across the four
      # networks, and how teams are placed on the leaderboard. Both implemented on both
      # sides, and both invisible when wrong: the tab and the app read the same documents,
      # and the board hides the figures on purpose, so a drift shows one team two
      # different answers with no way for anybody to tell which is right.
      - name: Portal matches the performance spec
        run: node web/performance-spec-test.mjs web/index.html performance-network-cases.csv performance-rank-cases.csv

      # And for how old somebody is. Aadil asked the phone to show a person's AGE and
      # never their date of birth, so on that screen the age is the only thing anybody can
      # check — a drift between the two sides says somebody is 39 here and 40 there, with
      # nothing on either screen to say which is right. The 29 February rule is in the
      # same table on purpose: somebody born on the 29th ages on the 28th in a common
      # year, which is the same day they are greeted, and those two facts must be one
      # rule. The phone's copy is checked by gradle test in the build-apk workflow.
      - name: Portal matches the birthday spec
        run: node web/birthday-spec-test.mjs web/index.html birthday-cases.csv

      # And for what an employee owes. The last rule that was implemented twice with
      # nothing tying the two together — the employee reads their balance on the phone
      # and Aadil reads the same balance on the portal, so a drift is an argument about
      # money with nothing on either screen to settle it. Writing the file found them
      # already disagreeing about the order invoices are listed in. The phone's copy is
      # checked by gradle test in the build-apk workflow.
      - name: Portal matches the debt spec
        run: node web/debt-spec-test.mjs web/index.html debt-cases.csv

      # And for what a recorded route means — how far apart two points are, and which
      # points are worth keeping at all. Both implemented on both sides, and both
      # invisible when wrong: a route that sums the drift of a parked phone draws a
      # perfectly convincing map of a journey nobody made, and the distance it reports is
      # the one an odometer reading is going to be checked against.
      - name: Portal matches the location spec
        run: node web/location-spec-test.mjs web/index.html location-distance-cases.csv location-filter-cases.csv

      # THE SAME CHECKS, ON OTHER DAYS. A fixture with a date typed into it passes on the
      # day it is written and goes red later for a rule that never changed — quietly, and
      # long after the change that should have caught it. Seven of them had collected in
      # this suite before this step existed: one went red the morning after it was
      # written, one was three weeks off, and four had only ever been green because the
      # current month happened to be the September their figures were keyed to. None of
      # that shows in a run on one day, which is the whole problem — the suite looks fine.
      #
      # Three dates ahead of whenever this runs, so the sweep always looks forward rather
      # than at years somebody chose once, plus the two calendar edges that never stop
      # mattering: 29 February, and the 28th of a common year, which is the day somebody
      # born on the 29th is greeted and aged.
      - name: The same checks, run as if it were another day
        run: |
          DATES="$(date -d '+40 days' +%F) $(date -d '+1 year' +%F) $(date -d '+5 years' +%F) 2027-02-28 2028-02-29"
          CHECKS=(
            "web/smoke-test.mjs web/index.html"
            "web/parser-test.mjs web/index.html"
            "web/render-test.mjs web/index.html"
            "web/service-schedule-test.mjs web/index.html service-schedule-cases.csv"
            "functions/service-schedule-test.mjs service-schedule-cases.csv"
            "web/parking-curfew-test.mjs web/index.html parking-curfew-cases.csv"
            "web/plate-format-test.mjs web/index.html plate-format-cases.csv"
            "web/performance-spec-test.mjs web/index.html performance-network-cases.csv performance-rank-cases.csv"
            "web/birthday-spec-test.mjs web/index.html birthday-cases.csv"
            "web/debt-spec-test.mjs web/index.html debt-cases.csv"
            "web/location-spec-test.mjs web/index.html location-distance-cases.csv location-filter-cases.csv"
          )
          FAILED=0
          for D in $DATES; do
            echo "::group::as if it were $D"
            for C in "${CHECKS[@]}"; do
              # Unquoted on purpose: each entry is a command and its arguments.
              node web/at-date.mjs "$D" $C || {
                echo "::error::${C%% *} fails when run as if it were $D — a fixture is pinned to a date, or the rule really is wrong on that day"
                FAILED=1
              }
            done
            echo "::endgroup::"
          done
          [ "$FAILED" = 0 ]

      - name: Cloud Functions parse
        run: |
          node --check functions/index.js
          node --check functions/service-schedule.js

      # firebase.json is deliberately left out: the Firebase CLI allows comments in
      # it and ours has them, so it is not strict JSON and JSON.parse would fail.
      - name: Config files are valid JSON
        run: |
          for f in .firebaserc firestore.indexes.json functions/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              && echo "$f OK" \
              || { echo "::error file=$f::not valid JSON"; exit 1; }
          done
