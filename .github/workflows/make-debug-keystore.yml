name: Make the signing key

# RUN THIS ONCE, BY HAND, AND THEN NEVER AGAIN.
#
# It makes the one debug signing key every APK is signed with, so an update installs
# over the build before it instead of being refused as a different app.
#
# There is no JDK on the machine this app is written on, which is why this is a workflow
# rather than a command to run locally: the runner has keytool, so the key is made here
# and handed back as a build artifact.
#
# THE KEY IS NEVER PRINTED. It leaves as an artifact, which needs a GitHub login to
# download — this repository is public, and a key in a log is a key anyone can take and
# use to sign an APK that a phone would accept as an update to the real app.
#
# What to do with it is in the job summary when this finishes.
#
# RUNNING IT A SECOND TIME MAKES A DIFFERENT KEY. Replacing the secret with a new one
# puts every phone back to "App not installed" until the app is uninstalled. If the key
# is ever lost, that is the price; otherwise leave this alone.
on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The standard debug credentials, which are the same on every Android install in
      # the world and are not a secret. The FILE is the secret.
      - name: Make the key
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=Fleet Tracker Debug, OU=CSPC, O=CSPC, L=Johannesburg, C=ZA"
          echo "made $(wc -c < debug.keystore) bytes"

      # Printed so the fingerprint can be checked against a later build's, and because
      # Firebase wants the SHA-1 if Google sign-in is ever switched on. A fingerprint is
      # public information — it identifies the key, it does not unlock it.
      - name: Its fingerprints
        run: |
          keytool -list -v -keystore debug.keystore -storepass android \
            | grep -E 'SHA1:|SHA256:' | tee fingerprints.txt

      - name: Hand it back
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 1

      - name: What to do with it
        run: |
          {
            echo "## The signing key is ready"
            echo
            echo "Download **debug-keystore** from the Artifacts section at the bottom of this page."
            echo "It is deleted after one day — if you miss it, run this workflow again."
            echo
            echo "Then, in PowerShell, in the folder you unzipped it into:"
            echo
            echo '```powershell'
            echo '[Convert]::ToBase64String([IO.File]::ReadAllBytes("debug.keystore")) | Set-Clipboard'
            echo '```'
            echo
            echo "That puts the whole thing on your clipboard. Paste it into a new secret:"
            echo
            echo "**Settings → Secrets and variables → Actions → New repository secret**"
            echo
            echo '- Name: `DEBUG_KEYSTORE_BASE64`'
            echo "- Secret: paste"
            echo
            echo "Then run **Build APK**. From that build on, every update installs over the last one."
            echo
            echo "### Its fingerprints"
            echo
            echo '```'
            cat fingerprints.txt
            echo '```'
            echo
            echo "Keep the .keystore file somewhere safe and off this repository. Losing it means"
            echo "making a new one, and every phone needs the app uninstalled once more."
          } >> "$GITHUB_STEP_SUMMARY"
