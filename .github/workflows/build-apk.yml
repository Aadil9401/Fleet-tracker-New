name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode google-services.json
        run: |
          # tr strips any stray newlines/spaces so a slightly untidy paste still decodes
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '[:space:]' | base64 --decode > app/google-services.json
          if ! grep -q '"project_id"' app/google-services.json; then
            echo "::error::The GOOGLE_SERVICES_JSON_BASE64 secret did not decode to a valid google-services.json."
            echo "::error::Re-generate it with: [Convert]::ToBase64String([IO.File]::ReadAllBytes('google-services.json'))"
            exit 1
          fi
          echo "google-services.json decoded OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fleet-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # After the upload on purpose: if the service rules have drifted from
      # service-schedule-cases.csv the run should go red, but the APK is still there to
      # download. Its two JS counterparts run in the checks workflow.
      - name: Phone app matches the service schedule spec
        run: gradle testDebugUnitTest --no-daemon
