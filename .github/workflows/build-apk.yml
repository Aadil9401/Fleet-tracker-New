name: Build APK

# This job is the only thing that compiles the app and runs its unit tests, and it
# used to run only after a change had already landed on main — so the Kotlin was
# never verified until it was too late to not merge it. Two more triggers:
#
#   pull_request   the app compiles before a merge, the way checks.yml already does
#                  for the portal and the Cloud Functions.
#   verify/**      push to a branch named verify/something to compile it on demand,
#                  without a pull request and without going near main.
#
# A pull request from a fork gets no secrets, so the google-services.json step will
# fail on one by design — there is no way to build a Firebase app from a fork anyway.
on:
  push:
    branches: [ main, 'verify/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the release step at the end. Everything else here only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode google-services.json
        run: |
          # tr strips any stray newlines/spaces so a slightly untidy paste still decodes
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '[:space:]' | base64 --decode > app/google-services.json
          if ! grep -q '"project_id"' app/google-services.json; then
            echo "::error::The GOOGLE_SERVICES_JSON_BASE64 secret did not decode to a valid google-services.json."
            echo "::error::Re-generate it with: [Convert]::ToBase64String([IO.File]::ReadAllBytes('google-services.json'))"
            exit 1
          fi
          echo "google-services.json decoded OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fleet-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # After the upload on purpose: a failure here should turn the run red, but the APK
      # is still worth having to hand.
      #
      # This one command runs every unit test in the app, not only the service rules it
      # was named after when it was added: the parking curfew against its own shared
      # table, the fuel slip parser against the layouts the forecourts print, and the
      # day view's eight figures with the rows behind each one. The JS counterparts to
      # the two shared tables run in the checks workflow.
      - name: App unit tests, and the shared specs it answers to
        run: gradle testDebugUnitTest --no-daemon

      # The artifact above is the wrong shape for the one thing the APK is for, which is
      # getting onto a phone: it needs a GitHub login, it expires after 90 days, it
      # arrives as a zip, and it is found by scrolling to the bottom of a run page. This
      # publishes the same file to one fixed link instead:
      #
      #   .../releases/download/debug-latest/app-debug.apk
      #
      # A rolling tag, so each build replaces the file rather than leaving a pile of
      # releases behind. create-then-upload rather than delete-then-create, so a failed
      # run cannot leave the link pointing at nothing.
      #
      # Deliberately AFTER the tests, unlike the artifact: something failing its own
      # tests should not become the build that staff install.
      #
      # Only on a push — a pull request from a fork has no write permission, and this
      # would be the step that fails.
      - name: Publish the APK to one fixed download link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view debug-latest >/dev/null 2>&1 || gh release create debug-latest \
            --title "Latest debug APK" \
            --prerelease \
            --notes "The current debug build, for installing on staff phones. Replaced by every build, so this link always points at the newest one."
          gh release upload debug-latest \
            app/build/outputs/apk/debug/app-debug.apk --clobber
          echo "APK: ${{ github.server_url }}/${{ github.repository }}/releases/download/debug-latest/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
